name: CI

on:
  push:
    branches: [main]
  pull_request:

# contents: read is enough for actions/checkout and every step below — this
# workflow only reads the repository, installs dependencies, and runs
# typecheck/lint/test/build. It never writes back to the repository or to a
# pull request. CI is reporting-only in v1: no step here can fail a build for
# an audit finding, only for a genuine typecheck/lint/test/build failure.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite takes roughly 5 minutes locally; this leaves generous
    # headroom for slower CI hardware plus the two known-environmental tests
    # (benchmark-cli-metrics, oracle-corpus-integration) that can each run up
    # to their own ~90s internal timeout before failing.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Minimum Node version this package supports (package.json
          # "engines"). Keep in sync if "engines" changes.
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
